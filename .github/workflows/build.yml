name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask requests pyinstaller pywebview

      - name: Build EXE
        run: |
          pyinstaller --name PlanMaster --onedir --windowed --icon icon.ico --add-data "templates;templates" --add-data "static;static" --hidden-import flask --hidden-import sqlite3 --hidden-import webview --hidden-import webview.platforms --hidden-import webview.platforms.winforms --exclude-module simplejson --noconfirm --clean app.py
        shell: bash

      - name: Build Setup
        run: |
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build_setup.iss
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanMaster-Windows-Setup
          path: dist/PlanMaster-Setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install flask requests pyinstaller pywebview

      - name: Build app
        run: |
          pyinstaller --name PlanMaster --onedir --windowed --icon icon.icns --add-data "templates:templates" --add-data "static:static" --hidden-import flask --hidden-import sqlite3 --hidden-import webview --hidden-import webview.platforms --hidden-import webview.platforms.cocoa --exclude-module simplejson --noconfirm --clean app.py

      - name: Create DMG
        run: |
          mkdir -p dist/dmg_temp
          cp -r dist/PlanMaster.app dist/dmg_temp/
          ln -sf /Applications dist/dmg_temp/Applications
          hdiutil create -volname PlanMaster -srcfolder dist/dmg_temp -ov -format UDZO PlanMaster.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PlanMaster-macOS
          path: PlanMaster.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts with version
        run: |
          VERSION=$(grep "CURRENT_VERSION" app.py | head -1 | sed "s/.*'\\(.*\\)'.*/\\1/")
          mv artifacts/PlanMaster-Windows-Setup/PlanMaster-Setup.exe "artifacts/PlanMaster-Windows-Setup/PlanMaster-Setup-v${VERSION}.exe"
          mv artifacts/PlanMaster-macOS/PlanMaster.dmg "artifacts/PlanMaster-macOS/PlanMaster-macOS-v${VERSION}.dmg"

      - name: Check version and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "CURRENT_VERSION" app.py | head -1 | sed "s/.*'\\(.*\\)'.*/\\1/")
          echo "Version: $VERSION"
          if gh release view "v$VERSION" &>/dev/null; then
            echo "Release v$VERSION already exists, skipping"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "PlanMaster v$VERSION" \
            --generate-notes \
            "artifacts/PlanMaster-Windows-Setup/PlanMaster-Setup-v${VERSION}.exe" \
            "artifacts/PlanMaster-macOS/PlanMaster-macOS-v${VERSION}.dmg"
