name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Python backend with PyInstaller
        run: |
          pip install pyinstaller flask requests
          pyinstaller --name PlanMaster-Backend --onedir --console --add-data "templates;templates" --add-data "static;static" --hidden-import flask --hidden-import sqlite3 --exclude-module simplejson --noconfirm --clean app.py

      - name: Install Electron dependencies
        run: npm ci

      - name: Build Electron app for Windows
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlanMaster-Windows-Setup
          path: release/*.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Vue frontend
        run: |
          cd frontend
          npm ci
          npm run build
          cd ..

      - name: Build Python backend with PyInstaller
        run: |
          pip install pyinstaller flask requests
          pyinstaller --name PlanMaster-Backend --onedir --console --add-data "templates:templates" --add-data "static:static" --hidden-import flask --hidden-import sqlite3 --exclude-module simplejson --noconfirm --clean app.py

      - name: Install Electron dependencies
        run: npm ci

      - name: Build Electron app for macOS
        run: npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""

      - name: Remove quarantine attributes
        run: |
          # Remove quarantine attributes from DMG files
          for dmg in release/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Removing quarantine from: $dmg"
              xattr -cr "$dmg"
            fi
          done
          # Also remove from any .app bundles in release
          for app in release/*.app; do
            if [ -d "$app" ]; then
              echo "Removing quarantine from: $app"
              xattr -cr "$app"
            fi
          done

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: PlanMaster-macOS
          path: release/*.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename artifacts with version
        run: |
          VERSION=$(grep "CURRENT_VERSION" app.py | head -1 | sed "s/.*'\\(.*\\)'.*/\\1/")
          echo "Version: $VERSION"
          find artifacts/PlanMaster-Windows-Setup -name "*.exe" -exec mv {} "artifacts/PlanMaster-Windows-Setup/PlanMaster-Setup-v${VERSION}.exe" \;
          find artifacts/PlanMaster-macOS -name "*.dmg" -exec mv {} "artifacts/PlanMaster-macOS/PlanMaster-macOS-v${VERSION}.dmg" \;

      - name: Check version and create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep "CURRENT_VERSION" app.py | head -1 | sed "s/.*'\\(.*\\)'.*/\\1/")
          echo "Version: $VERSION"
          if gh release view "v$VERSION" &>/dev/null; then
            echo "Release v$VERSION already exists, skipping"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "PlanMaster v$VERSION" \
            --generate-notes \
            "artifacts/PlanMaster-Windows-Setup/PlanMaster-Setup-v${VERSION}.exe" \
            "artifacts/PlanMaster-macOS/PlanMaster-macOS-v${VERSION}.dmg"
